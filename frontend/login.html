<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to FinPocket — Access your personal finance dashboard.">
    <title>Login — FinPocket</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon">💰</div>
                    <span>FinPocket</span>
                </a>
                <h1>Welcome Back</h1>
                <p>Sign in to access your financial dashboard</p>
            </div>

            <!-- Alert Container -->
            <div id="login-alert" class="auth-alert"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="login-email" class="form-control"
                               placeholder="Enter your email" autocomplete="email" required>
                    </div>
                    <span class="field-error" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="login-password" class="form-control"
                               placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                    <span class="field-error" id="password-error"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link" onclick="alert('Password reset coming soon!'); return false;">Forgot password?</a>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-auth">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
