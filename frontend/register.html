<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your FinPocket account — Start managing your personal finances today.">
    <title>Register — FinPocket</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon">💰</div>
                    <span>FinPocket</span>
                </a>
                <h1>Create Account</h1>
                <p>Start your financial journey with FinPocket</p>
            </div>

            <!-- Alert Container -->
            <div id="register-alert" class="auth-alert"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="reg-fullname">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="reg-fullname" class="form-control"
                               placeholder="Enter your full name" autocomplete="name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="reg-email" class="form-control"
                               placeholder="Enter your email" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-phone">Phone Number <span style="color:var(--text-muted);">(Optional)</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="reg-phone" class="form-control"
                               placeholder="Enter your phone number" autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reg-password" class="form-control"
                               placeholder="Create a strong password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="toggle-reg-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-text" id="strength-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reg-confirm-password" class="form-control"
                               placeholder="Confirm your password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="toggle-confirm-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <button type="submit" id="register-btn" class="btn btn-primary btn-auth" style="margin-top: 8px;">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
