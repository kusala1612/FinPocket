<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Forgot Password — FinPocket. Reset your account password.">
    <title>Forgot Password — FinPocket</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon">💰</div>
                    <span>FinPocket</span>
                </a>
                <h1>Forgot Password</h1>
                <p>Enter your registered email and we'll send you a link to reset your password</p>
            </div>

            <!-- Alert Container -->
            <div id="forgot-alert" class="auth-alert"></div>

            <form id="forgot-form" novalidate>
                <div class="form-group">
                    <label for="forgot-email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="forgot-email" class="form-control"
                               placeholder="Enter your registered email" autocomplete="email" required>
                    </div>
                    <span class="field-error" id="email-error"></span>
                </div>

                <button type="submit" id="forgot-btn" class="btn btn-primary btn-auth">
                    Send Reset Link
                </button>
            </form>

            <div class="auth-footer" style="margin-top: 24px;">
                Remembered your password? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
