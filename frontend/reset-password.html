<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset Password — FinPocket. Set a new password for your account.">
    <title>Reset Password — FinPocket</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon">💰</div>
                    <span>FinPocket</span>
                </a>
                <h1>Reset Password</h1>
                <p>Create a new secure password for your account</p>
            </div>

            <!-- Alert Container -->
            <div id="reset-alert" class="auth-alert"></div>

            <form id="reset-form" novalidate>
                <div class="form-group">
                    <label for="reset-password">New Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reset-password" class="form-control"
                               placeholder="Enter new password (min. 6 chars)" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="toggle-reset-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-text" id="strength-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reset-confirm-password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reset-confirm-password" class="form-control"
                               placeholder="Confirm your new password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="toggle-confirm-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <button type="submit" id="reset-btn" class="btn btn-primary btn-auth" style="margin-top: 8px;">
                    Update Password
                </button>
            </form>

            <div class="auth-footer" style="margin-top: 24px;">
                Remembered your password? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
